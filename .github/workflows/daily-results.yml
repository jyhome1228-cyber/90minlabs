name: Daily football results (09:00 KST)

on:
  schedule:
    # KST is UTC+09:00 year-round. GitHub cron is best effort, not an SLA.
    # 09:00 primary; 09:17 and 09:47 checks recover a delayed/dropped hourly run.
    - cron: '0 0 * * *'
    - cron: '17 0 * * *'
    - cron: '47 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/daily-results.cjs'
      - 'scripts/build-nearby-fixtures.cjs'
      - 'tests/daily-results.test.cjs'
      - '.github/workflows/daily-results.yml'

permissions:
  contents: write

concurrency:
  group: daily-football-results
  cancel-in-progress: false

jobs:
  sync:
    name: Verify results and update site data
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check sync implementation
        run: |
          node --check scripts/daily-results.cjs
          node --check scripts/build-nearby-fixtures.cjs
          node --test tests/daily-results.test.cjs
      - name: Fetch verified 2026/27 results and rebuild snapshots
        run: node scripts/daily-results.cjs
      - name: Prepare lightweight rolling fixtures for homepage
        run: node scripts/build-nearby-fixtures.cjs
      - name: Commit only changed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "90MIN LABS Results Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/match-calendar.json data/team-results.json data/league-data.json data/auto-sync-status.json data/nearby-fixtures.json
          if git diff --cached --quiet; then
            echo "No new verified results or status updates."
            exit 0
          fi
          git commit -m "data: daily verified football scores [09:00 KST]"
          # Concurrent website edits can move main between checkout and push.
          # Rebase our data-only commit onto the newest main; never force-push.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Verified result/status data committed successfully."
              exit 0
            fi
            echo "Attempt ${attempt}: main moved; fetching and rebasing data-only commit."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Data file conflict during rebase; manual review required."
              exit 1
            fi
            sleep 3
          done
          echo "::error::Unable to publish data after 5 non-force push attempts."
          exit 1
